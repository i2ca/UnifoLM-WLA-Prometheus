# Teleoperação VR no robô real no FORMATO DO WLA (30/09) — para treinar/testar antes de gravar.
#
# Pré-requisito no robô: ./init_prometheus-vla.sh com CAMERA_ESTEREO=true (cameras_wla_server.py:
# ZED em head_stereo_left/right + punhos em wrist_left/wrist_right, 640x480, porta 5555).
#
#   cd lerobot-ext
#   python init_lerobot_teleoparate_v2.py --config_path=config/teleop/teleop_vr_wla.yaml
#
# CONTROLES:
#   CABEÇA     girar a cabeça para os lados gira o TRONCO do robô (yaw da cintura, até ±57°),
#              a partir de para onde você olhava ao destravar. Olhadinhas < 3° não mexem.
#   ESQUERDO   analógico: ANDA — Y frente/trás, X para os lados. X trava/destrava, Y encerra.
#   DIREITO    analógico X: GIRA o corpo inteiro. A salva o episódio, B descarta.
#   MÃOS       gatilho de GRIP (dedo médio) fecha a mão inteira; gatilho do INDICADOR faz a pinça.
#   Andar e girar o corpo NÃO vão para o dataset — faça isso ENTRE episódios.
#   PARADA     clique nos DOIS analógicos = damping (robô mole) + trava.
#
# VISÃO: estéreo — cada olho do óculos recebe um olho da ZED (3D de verdade).

robot:
  type: unitree_g1_dex3
  robot_ip: "192.168.123.164"
  use_loco: true
  use_waist_yaw: true
  waist_yaw_limit: 1.0
  cameras_wla: true
  cameras_wla_estereo: true
  use_depth_camera: false
  use_wrist_camera: false

teleop:
  type: xr_g1_arm
  zmq: true
  img_server_ip: "192.168.123.164"
  input_mode: "controller"
  display_mode: "ego"
  ee_type: "dex3"
  dashboard: true
  dashboard_port: 8080
  vuer_host_ip: ""
  head_cam_size: 1.0
  head_cam_distance: 1.5
  show_hud: true

  stereo_head: false   # 3D ficou ruim (30/09): tela 2D com o olho esquerdo da ZED
  head_cam_keys: ["head_stereo_left", "head_stereo_right"]

  torso_follows_head: true
  torso_head_gain: 1.0
  torso_max_speed: 0.8
  torso_head_deadzone: 0.05
  waist_yaw_limit: 1.0
  waist_invert: false
  head_yaw_lock: true

  enable_locomotion: true
  loco_style: "original"
  loco_port: 6005
  loco_ip: ""
  loco_max_speed: 0.3
  loco_max_lateral: 0.2
  loco_max_yaw: 0.5
  loco_deadzone: 0.2

  # painel da câmera do punho direito, que segue a sua mão (agora na 5555, chave wrist_right)
  show_wrist_cam: true
  wrist_img_port: 5555
  wrist_cam_name: "wrist_right"
  wrist_cam_side: "right"
  wrist_cam_size: 0.10
  wrist_cam_offset: [0.0, -0.14, 0.0]
