# GRAVAÇÃO PARA O ER-1 (04/11) — a chaleira LIGADA até DESLIGAR SOZINHA (a água ferveu): o robô PARADO olhando.
# NÃO é para treinar o WLA: é para o ER-1 aprender a ver a LUZ VERMELHA da chaleira (pequena) — "acendeu?",
# "ainda está esquentando?", "apagou (ferveu)?" — e avisar o WLA / o orquestrador quando passar para a próxima etapa.
#
# Frase (só para o registro): "Wait until the electric kettle turns off."
#
#   cd lerobot-ext
#   conda activate prometheus-vla
#   python init_lerobot_record_v2.py --config_path=config/record/record_vr_cafe_chaleira_espera_er1.yaml
#
# ÁGUA: com água (o suficiente para uma xícara: ferve em poucos minutos). NUNCA vazia.
# O EPISÓDIO (uns 2-5 min cada):
#   1. robô na pose de gravação, a chaleira INTEIRA na imagem da cabeça, luz APAGADA; aperte A (começa)
#   2. ~5 s com a luz apagada; então LIGUE a chaleira (você mesmo, ou pela teleoperação) -> luz ACESA
#   3. deixe o robô PARADO (sem mexer os braços nem a cabeça) até a chaleira DESLIGAR sozinha -> luz apagada
#   4. ~5 s com a luz apagada de novo; aperte A (salva)
# VARIAÇÃO entre episódios: a chaleira em lugares diferentes da mesa, a luz da sala acesa/apagada, alguém passando
#   na frente às vezes — o ER-1 tem que achar a luz pequena em qualquer canto da imagem.
# Meta: 6-10 episódios (eu marco depois, quadro a quadro, quando a luz acendeu e quando apagou).
#
# Controle: A encerra e SALVA (B descarta). Termine com ESC ou a voz "finalizar".

robot:
  type: unitree_g1_dex3
  robot_ip: "192.168.123.164"
  use_loco: true
  use_waist_yaw: true
  waist_yaw_limit: 1.0
  cameras_wla: true
  cameras_wla_estereo: true
  gravar_locomocao: true      # base.vx/vy/vyaw/height no vetor de ação: registra se o robô andou
  gravar_pernas_cintura: true # estado: 12 juntas das pernas + roll/pitch da cintura MEDIDOS (lower_body do WLA)
  cintura_reta: true          # coluna RETA: roll/pitch da cintura seguros em 0 (kp/kd 300/8), não onde o peso deixar
  use_depth_camera: false
  use_wrist_camera: false

teleop:
  type: xr_g1_arm
  zmq: true
  img_server_ip: "192.168.123.164"
  input_mode: "controller"
  display_mode: "ego"
  ee_type: "dex3"
  dashboard: true
  dashboard_port: 8080
  vuer_host_ip: ""
  head_cam_size: 1.0
  head_cam_distance: 1.5
  show_hud: true

  stereo_head: false   # 3D ficou ruim (30/09): tela 2D com o olho esquerdo da ZED
  # pitch do punho ESQUERDO com a peça danificada e calçado (01/10): a IK não usa essa junta e a mantém
  # neste ângulo (sem isso o yaw do punho ficava pulando). Confira o ângulo no painel :8095; tire a linha
  # quando o punho for consertado.
  juntas_fixas: {left_wrist_pitch_joint: 0.33}
  head_cam_keys: ["head_stereo_left", "head_stereo_right"]

  torso_follows_head: true
  torso_head_gain: 1.0
  torso_max_speed: 0.8
  torso_head_deadzone: 0.05
  waist_yaw_limit: 1.0
  waist_invert: false
  head_yaw_lock: true

  enable_locomotion: true
  loco_style: "original"
  loco_port: 6005
  loco_ip: ""
  loco_max_speed: 0.3
  loco_max_lateral: 0.2
  loco_max_yaw: 0.5
  loco_deadzone: 0.2
  loco_no_dataset: true       # manda o comando de andar para o dataset (precisa do gravar_locomocao do robô)

  # painel da câmera do punho direito, que segue a sua mão (agora na 5555, chave wrist_right)
  show_wrist_cam: true
  wrist_img_port: 5555
  wrist_cam_name: "wrist_right"
  wrist_cam_side: "right"
  wrist_cam_size: 0.10
  wrist_cam_offset: [0.0, -0.14, 0.0]

dataset:
  repo_id: Mrwlker/cafe_chaleira_espera_er1
  root: "meu_dataset/cafe_chaleira_espera_er1"
  push_to_hub: false
  # Vídeos encodados DURANTE o episódio (o salvar fica rápido). Se o laço de gravação ficar lento no
  # notebook, troque para false — o controle do robô continua vivo no salvar de qualquer jeito (injeção 6).
  streaming_encoding: true
  encoder_threads: 2
  single_task: "Wait until the electric kettle turns off."
  fps: 30
  num_episodes: 100000   # sem limite: termine com ESC ou a voz "finalizar"
  episode_time_s: 3600   # 1 h: o episódio só acaba no A (salva) ou B (descarta)
  reset_time_s: 3600     # 1 h: arrume a cena e aperte A para começar o próximo
  rgb_encoder:
    vcodec: "h264"

play_sounds: false
