# GRAVAÇÃO de dataset para o WLA (30/09): mesma teleoperação do teleop_vr_wla.yaml, gravando
# head_stereo_left/right + wrist_left/wrist_right (640x480, nomes do dataset da Unitree), as 14 juntas
# dos braços + yaw da cintura + as mãos Dex3. push_to_hub: false — o dataset fica só neste PC.
#
#   cd lerobot-ext
#   python init_lerobot_record_v2.py --config_path=config/record/record_vr_wla_pick_apple.yaml
#
# A salva o episódio, B descarta. Ande (analógicos) só ENTRE episódios: andar não é gravado.

robot:
  type: unitree_g1_dex3
  robot_ip: "192.168.123.164"
  use_loco: true
  use_waist_yaw: true
  waist_yaw_limit: 1.0
  cameras_wla: true
  cameras_wla_estereo: true
  use_depth_camera: false
  use_wrist_camera: false

teleop:
  type: xr_g1_arm
  zmq: true
  img_server_ip: "192.168.123.164"
  input_mode: "controller"
  display_mode: "ego"
  ee_type: "dex3"
  dashboard: true
  dashboard_port: 8080
  vuer_host_ip: ""
  head_cam_size: 1.0
  head_cam_distance: 1.5
  show_hud: true

  stereo_head: false   # 3D ficou ruim (30/09): tela 2D com o olho esquerdo da ZED
  head_cam_keys: ["head_stereo_left", "head_stereo_right"]

  torso_follows_head: true
  torso_head_gain: 1.0
  torso_max_speed: 0.8
  torso_head_deadzone: 0.05
  waist_yaw_limit: 1.0
  waist_invert: false
  head_yaw_lock: true

  enable_locomotion: true
  loco_style: "original"
  loco_port: 6005
  loco_ip: ""
  loco_max_speed: 0.3
  loco_max_lateral: 0.2
  loco_max_yaw: 0.5
  loco_deadzone: 0.2

  # painel da câmera do punho direito, que segue a sua mão (agora na 5555, chave wrist_right)
  show_wrist_cam: true
  wrist_img_port: 5555
  wrist_cam_name: "wrist_right"
  wrist_cam_side: "right"
  wrist_cam_size: 0.10
  wrist_cam_offset: [0.0, -0.14, 0.0]

dataset:
  repo_id: Mrwlker/pick_up_apple_wla_2026-09-30
  root: "meu_dataset/pick_up_apple_wla_2026-09-30"
  push_to_hub: false
  single_task: "Pick up the apple."
  fps: 30
  num_episodes: 50
  episode_time_s: 30
  reset_time_s: 15
  rgb_encoder:
    vcodec: "h264"

play_sounds: false
