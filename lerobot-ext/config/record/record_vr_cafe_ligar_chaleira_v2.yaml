# GRAVAÇÃO v2 (04/11) — LIGAR a chaleira elétrica, COM A PRESSÃO DA DEX3 INTEIRA (108 canais por mão) e com o
# "deu certo" VISÍVEL: a luz vermelha da chaleira é pequena, então cada episódio termina com a luz ACESA e PARADA na
# imagem da cabeça (o ER-1 vai aprender a conferir a luz e avisar o WLA; ver record_vr_cafe_chaleira_espera_er1.yaml).
#
# Frase: "Turn on the electric kettle by pressing its power switch with the right hand."  (a mesma de 27/10: somam)
#
#   cd lerobot-ext
#   conda activate prometheus-vla
#   python init_lerobot_record_v2.py --config_path=config/record/record_vr_cafe_ligar_chaleira_v2.yaml
#   (continuar outro dia: --resume=true)
#
# ÁGUA: NÃO ligue a chaleira vazia. Água pelo menos na marca de MÍNIMO, ou desligue (levante o botão) logo depois
#   de salvar cada episódio — o episódio só precisa do momento em que a luz acende.
# COMEÇA: pose de gravação do painel :8095, chaleira DESLIGADA (luz apagada) e a chaleira INTEIRA na imagem da
#   cabeça (confira no HUD que a luz/botão aparecem); mão aberta, 1-2 s parado (o "repouso" da pressão).
# O EPISÓDIO: leva a mão até o botão, aperta com o dedo até ESTALAR (a luz acende), solta, afasta a mão.
# TERMINA: mão afastada e a LUZ VERMELHA ACESA na imagem da cabeça por ~2 s, parado. Só então A.
#   (se a luz não acendeu: B descarta)
#
# VARIAÇÃO: a chaleira em ~4 lugares (o de sempre, 8-10 cm para cada lado e um pouco para trás) e o bico/alça
#   girados ±20°; ~8 episódios com a mesa calçada 2-3 cm. A mão NÃO pode esconder a luz no fim.
# SEMPRE IGUAL: cintura reta, robô de pé na altura de sempre, ZED do init em 4/4/0/100 (como todos os datasets do WLA).
# Meta: 40 episódios LIMPOS (errou: B descarta).
#
# Controle: A encerra e SALVA (B descarta); arrume e aperte A para o próximo. Termine com ESC ou a voz "finalizar".

robot:
  type: unitree_g1_dex3
  robot_ip: "192.168.123.164"
  use_loco: true
  use_waist_yaw: true
  waist_yaw_limit: 1.0
  cameras_wla: true
  cameras_wla_estereo: true
  gravar_locomocao: true      # base.vx/vy/vyaw/height no vetor de ação: registra se o robô andou
  gravar_pernas_cintura: true # estado: 12 juntas das pernas + roll/pitch da cintura MEDIDOS (lower_body do WLA)
  cintura_reta: true          # coluna RETA: roll/pitch da cintura seguros em 0 (kp/kd 300/8), não onde o peso deixar
  use_depth_camera: false
  use_wrist_camera: false

teleop:
  type: xr_g1_arm
  zmq: true
  img_server_ip: "192.168.123.164"
  input_mode: "controller"
  display_mode: "ego"
  ee_type: "dex3"
  dashboard: true
  dashboard_port: 8080
  vuer_host_ip: ""
  head_cam_size: 1.0
  head_cam_distance: 1.5
  show_hud: true

  stereo_head: false   # 3D ficou ruim (30/09): tela 2D com o olho esquerdo da ZED
  # pitch do punho ESQUERDO com a peça danificada e calçado (01/10): a IK não usa essa junta e a mantém
  # neste ângulo (sem isso o yaw do punho ficava pulando). Confira o ângulo no painel :8095; tire a linha
  # quando o punho for consertado.
  juntas_fixas: {left_wrist_pitch_joint: 0.33}
  head_cam_keys: ["head_stereo_left", "head_stereo_right"]

  torso_follows_head: true
  torso_head_gain: 1.0
  torso_max_speed: 0.8
  torso_head_deadzone: 0.05
  waist_yaw_limit: 1.0
  waist_invert: false
  head_yaw_lock: true

  enable_locomotion: true
  loco_style: "original"
  loco_port: 6005
  loco_ip: ""
  loco_max_speed: 0.3
  loco_max_lateral: 0.2
  loco_max_yaw: 0.5
  loco_deadzone: 0.2
  loco_no_dataset: true       # manda o comando de andar para o dataset (precisa do gravar_locomocao do robô)

  # painel da câmera do punho direito, que segue a sua mão (agora na 5555, chave wrist_right)
  show_wrist_cam: true
  wrist_img_port: 5555
  wrist_cam_name: "wrist_right"
  wrist_cam_side: "right"
  wrist_cam_size: 0.10
  wrist_cam_offset: [0.0, -0.14, 0.0]

dataset:
  repo_id: Mrwlker/cafe_ligar_chaleira_v2
  root: "meu_dataset/cafe_ligar_chaleira_v2"
  push_to_hub: false
  # Vídeos encodados DURANTE o episódio (o salvar fica rápido). Se o laço de gravação ficar lento no
  # notebook, troque para false — o controle do robô continua vivo no salvar de qualquer jeito (injeção 6).
  streaming_encoding: true
  encoder_threads: 2
  single_task: "Turn on the electric kettle by pressing its power switch with the right hand."
  fps: 30
  num_episodes: 100000   # sem limite: termine com ESC ou a voz "finalizar"
  episode_time_s: 3600   # 1 h: o episódio só acaba no A (salva) ou B (descarta)
  reset_time_s: 3600     # 1 h: arrume a cena e aperte A para começar o próximo
  rgb_encoder:
    vcodec: "h264"

play_sounds: false
